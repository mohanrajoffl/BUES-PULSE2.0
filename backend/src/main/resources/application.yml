server:
  port: ${PORT:8080}

spring:
  application:
    name: buspulse-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/buspulse}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

buspulse:
  data-mode: ${DATA_MODE:DEMO}
  jwt-secret: ${JWT_SECRET:}
  cors-allowed-origins: ${APP_URL:http://localhost:3000}
